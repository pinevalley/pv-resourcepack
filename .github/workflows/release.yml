name: Release resource pack

on:
  push:
    branches: [main]
    paths: ['pack/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip pack
        run: |
          cd pack
          zip -r -X ../pinevalley.zip . -x '*.DS_Store'
          cd ..
          sha1sum pinevalley.zip | cut -d' ' -f1 > pinevalley.zip.sha1

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          gh release create "v${{ github.run_number }}" pinevalley.zip pinevalley.zip.sha1 \
            --title "Resource pack v${{ github.run_number }}" \
            --notes "${NOTES:-Manual release}" \
            --latest
